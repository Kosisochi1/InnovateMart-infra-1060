name: Bedrock-Infrastructure

on:
  pull_request: 
    branches: [main]
    paths:
      - 'terraform/**'
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
  workflow_dispatch:
    inputs:
      destroy:
        description: "⚠️ Set to true to DESTROY Bedrock infrastructure"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # - name: Helm login to GHCR
      #   run: |
      #     echo "${{ secrets.TOKEN_GHCR }}" \
      #     | helm registry login ghcr.io \
      #       -u ${{ github.actor }} \
      #       --password-stdin

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        working-directory: terraform
        run: terraform plan -no-color
        continue-on-error: true

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{secrets.AWS_REGION}}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # - name: Helm login to GHCR
      #   run: |
      #     echo "${{ secrets.TOKEN_GHCR }}" \
      #     | helm registry login ghcr.io \
      #       -u ${{ github.actor }} \
      #       --password-stdin

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

    
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply --auto-approve

      - name: Terraform Output
        working-directory: terraform
        run: terraform output -json > outputs.json

      - name: Display outputs
        working-directory: terraform
        run: |
          echo "📋 Infrastructure Outputs:"
          terraform output
          
  app-deploy:
     name: Deploy Application to EKS
     runs-on: ubuntu-latest
     needs: terraform-apply
     if: github.ref == 'refs/heads/main'

     steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Setup Terraform
       uses: hashicorp/setup-terraform@v3
       with:
         terraform_version: "1.10.5"

     - name: Configure AWS credentials
       uses: aws-actions/configure-aws-credentials@v4
       with:
         aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
         aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
         aws-region: ${{ secrets.AWS_REGION }}

     - name: Setup Helm
       uses: azure/setup-helm@v4

     - name: Terraform Init (read outputs)
       working-directory: terraform
       run: terraform init -input=false


     - name: Install kubectl
       uses: azure/setup-kubectl@v4

     - name: Configure kubeconfig
       # working-directory: terraform
       run: |
        CLUSTER_NAME=$(terraform -chdir=terraform output -raw cluster_name)

        aws eks update-kubeconfig \
          --region ${{ secrets.AWS_REGION }} \
          --name $CLUSTER_NAME

     - name: Deploy application with Helm
      # working-directory: terraform
       run: |
        helm upgrade --install retail-store ./retail-store \
          --namespace retail-app \
          --create-namespace \
          --wait


 


  terraform-destroy:
    name: Terraform Destroy (Bedrock-Infrastructure)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'

    steps:
      - name: ⚠️ Confirm destroy intent
        run: |
          echo "🚨 DESTROYING Bedrock Infrastructure"
          echo "This action is irreversible."

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      # - name: Helm login to GHCR
      #   run: |
      #     echo "${{ secrets.TOKEN_GHCR }}" \
      #     | helm registry login ghcr.io \
      #       -u ${{ github.actor }} \
      #       --password-stdin

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Init
        working-directory: terraform
        run: | 
         # terraform state rm kubernetes_namespace.retail
         terraform init --upgrade
         terraform init

      - name: Terraform Destroy
        working-directory: terraform
        run: ../script/destroy_tf.sh
